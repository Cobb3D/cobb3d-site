<script>
  // Light or dark look, set before the page draws (see initTheme in js/site.js).
  (function () {
    var t = null;
    try { t = localStorage.getItem('cobb3d.pageTheme'); } catch (e) { t = null; }
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
